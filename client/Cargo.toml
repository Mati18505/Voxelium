[package]
name = "client"
edition = "2021"

[dependencies]
cgmath = "0.18.0"
bevy_asset_loader = { version = "0.25.0", features=["standard_dynamic_assets", "2d"] }
bevy_infinite_grid = { git = "https://github.com/ForesightMiningSoftwareCorporation/bevy_infinite_grid", branch = "main" }
shared = { path = "../shared" }
thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
bevy_common_assets = { version = "0.15.0", features = ["yaml", "json"] }
crossbeam-channel = "0.5.15"
rand = "0.9.1"
yaml-rust2 = "0.10.4"
lazy_static = "1.5.0"

[dev-dependencies]
assert_matches = "1.5"

[dependencies.bevy]
workspace = true
features = [
  "default_platform",
  "3d_api",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_gizmos_render",
  "free_camera",
]
