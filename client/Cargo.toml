[package]
name = "client"
edition = "2021"

[dependencies]
cgmath = "0.18.0"
bevy = { version = "0.16.0", features = ["dynamic_linking"] }
bevy_flycam = { git = 'https://github.com/kristoff3r/bevy_flycam/' }
bevy_asset_loader = { git = 'https://github.com/NiklasEi/bevy_asset_loader/', branch = 'bevy_main', features=["standard_dynamic_assets", "2d"] }
shared = { path = "../shared" }
thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
bevy_common_assets = { version = "0.13.0", features = ["yaml", "json"] }
crossbeam-channel = "0.5.15"